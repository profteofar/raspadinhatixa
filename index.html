<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVELATIO - Arquivo Familiar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Crimson Pro', serif;
            background-color: #e2dcd0;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            overflow-x: hidden;
        }
        .serif-title { font-family: 'Playfair Display', serif; }
        
        .scratch-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 4/3; 
            overflow: hidden;
            cursor: none; 
            background: #1c1917;
            touch-action: none;
        }
        
        @media (max-width: 768px) {
            .scratch-container {
                aspect-ratio: 1/1;
            }
        }
        
        #custom-cursor {
            position: fixed;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: width 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), height 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        #zoom-wrapper {
            position: absolute;
            inset: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        canvas { 
            z-index: 30;
            position: absolute;
            inset: 0;
        }
        
        #hidden-root { z-index: 10; }
        #dynamic-layers { z-index: 20; pointer-events: none; }

        .reveal-layer { 
            opacity: 0; 
            transform: scale(0.95); 
            transition: opacity 0.6s ease, transform 0.6s ease; 
        }
        .reveal-layer.visible { opacity: 1; transform: scale(1); }
        
        .progress-bar-container {
            background: rgba(0,0,0,0.3);
            border-radius: 99px;
            height: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: #f59e0b;
            width: 100%;
            transition: width 0.3s ease;
        }
        
        .unlocked-status .progress-fill { background: #10b981; }

        .quiz-option {
            transition: all 0.2s ease;
            border: 1px solid #d6d3d1;
        }
        .quiz-option:hover:not(:disabled) { background-color: #f5f5f4; }
        .quiz-option:disabled { cursor: not-allowed; }
        .quiz-correct { background-color: #dcfce7 !important; border-color: #166534 !important; color: #166534; }
        .quiz-incorrect { background-color: #fee2e2 !important; border-color: #991b1b !important; color: #991b1b; animation: shake 0.4s ease; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .archive-stamp { border: 2px solid #991b1b; color: #991b1b; padding: 2px 8px; font-weight: bold; text-transform: uppercase; transform: rotate(15deg); opacity: 0.7; }
        
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .ready-to-quiz { animation: pulse-gold 2s infinite; }

        .btn-disabled {
            opacity: 0.3;
            filter: grayscale(1);
        }

        #modal-content-wrapper {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .score-badge {
            animation: scoreAppear 0.5s ease;
        }

        @keyframes scoreAppear {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen text-stone-800 p-3 md:p-8 lg:p-12">

    <div id="custom-cursor"></div>

    <div class="max-w-6xl mx-auto">
        <header class="mb-6 md:mb-12 text-center">
            <h1 class="serif-title text-4xl md:text-7xl font-black text-stone-900 mb-1">REVELATIO</h1>
            <p class="text-stone-500 tracking-[0.2em] md:tracking-[0.3em] uppercase text-[10px] md:text-sm">Raspadinha de Interação Familiar</p>
        </header>

        <main class="grid lg:grid-cols-12 gap-6 lg:gap-12 items-start">
            <div class="lg:col-span-7 relative">
                <div id="scratch-wrapper" class="scratch-container border-4 md:border-8 border-stone-900 shadow-2xl select-none">
                    <div id="zoom-wrapper">
                        <div id="hidden-root" class="absolute inset-0 bg-stone-200">
                            <img id="reveal-img" class="absolute inset-0 w-full h-full object-cover grayscale opacity-40" src="" alt="">
                            <div id="dynamic-layers" class="absolute inset-0"></div>
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <img id="overlay-img" class="w-full h-full object-cover mix-blend-multiply opacity-90" src="" alt="">
                            </div>
                        </div>
                        <canvas id="scratch-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
                <div id="info-panel" class="bg-stone-800 text-stone-100 p-6 md:p-8 shadow-2xl relative overflow-hidden min-h-[300px] md:min-h-[400px] flex flex-col">
                    <div id="case-number" class="absolute top-0 right-0 p-2 text-[60px] md:text-[80px] font-black opacity-5 pointer-events-none leading-none">1</div>
                    
                    <!-- Score Display -->
                    <div class="absolute top-4 left-4 bg-amber-500/20 border-2 border-amber-500 px-3 py-1 rounded score-badge">
                        <div class="flex gap-4 text-xs font-black uppercase">
                            <span class="text-amber-400">★ <span id="score-display">0</span></span>
                            <span class="text-red-400">✗ <span id="failures-display">0</span></span>
                            <span class="text-blue-400">⏱ <span id="timer-display">00:00</span></span>
                        </div>
                    </div>
                    
                    <div id="hud-sidebar" class="mb-6 mt-8">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-[10px] tracking-widest text-stone-400 uppercase font-mono">Processamento de Ruído</span>
                            <span id="reveal-pct" class="text-xl font-black text-amber-500">100%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                        <div id="reveal-status" class="text-[9px] mt-2 text-stone-400 font-bold uppercase tracking-tighter">Limpar evidência (Faltam <span id="target-left">30</span>%)</div>
                    </div>

                    <div class="border-b border-stone-600 pb-4 mb-4">
                        <span class="text-xs tracking-widest text-stone-400 uppercase">Documento Arquivado</span>
                        <h2 id="case-title" class="serif-title text-2xl md:text-4xl font-bold mt-2 uppercase">REVELATIO</h2>
                    </div>
                    <p id="case-desc" class="text-stone-300 text-base md:text-lg leading-relaxed italic flex-grow">"..."</p>
                    
                    <div class="mt-6 pt-6 border-t border-stone-700">
                        <button id="btn-quiz-panel" onclick="app.openQuiz()" disabled class="w-full bg-stone-700 text-stone-500 py-3 md:py-4 font-black uppercase tracking-widest transition-all flex items-center justify-center gap-3 opacity-50 cursor-not-allowed">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Questionar Evidência
                        </button>
                        <p id="quiz-hint" class="text-[10px] text-center mt-2 text-stone-500 uppercase font-mono">Clareza insuficiente</p>
                    </div>
                </div>

                <div class="flex flex-col gap-4">
                    <button id="btn-next" onclick="app.next()" disabled class="btn-disabled bg-stone-900 text-white py-4 px-6 flex items-center justify-center gap-4 hover:bg-stone-950 transition-all font-bold uppercase tracking-widest border-b-4 border-stone-700 active:border-b-0 active:translate-y-1">
                        <span id="btn-next-text">Próxima Evidência</span>
                    </button>
                    <p id="nav-hint" class="text-[10px] text-center text-stone-500 uppercase font-bold tracking-tighter pb-8">Resolva o questionário para prosseguir</p>
                </div>
            </div>
        </main>

        <footer class="mt-4 md:mt-12 pt-8 border-t border-stone-300 overflow-x-auto">
            <h4 class="text-[10px] font-black uppercase tracking-widest text-stone-400 mb-4">Evidências Identificadas</h4>
            <div id="gallery-thumbs" class="flex gap-4 pb-4 min-h-[60px]">
                <!-- Miniaturas aparecem por descoberta -->
            </div>
        </footer>
    </div>

    <div id="modal-overlay" class="fixed inset-0 z-[100] bg-black/80 hidden items-center justify-center p-4 md:p-6 opacity-0 pointer-events-none">
        <div id="modal-container" class="bg-[#f2efe9] max-w-lg w-full p-6 md:p-8 shadow-2xl border-t-8 border-stone-900 relative">
            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-stone-500 hover:text-stone-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <h3 id="modal-title" class="serif-title text-xl md:text-2xl font-bold mb-4 border-b border-stone-300 pb-2">Questionário</h3>
            <div id="modal-content-wrapper"></div>
        </div>
    </div>

    <script>
        const GALLERY_CONFIG = {
            1: {
                title: "SORRISO LUMINOSO",
                description: "Um sorriso genuíno e radiante.",
                quiz: {
                    question: "Em que ano nasci?",
                    options: ["1971", "1975", "1976"],
                    correct: 1
                }
            },
            2: {
                title: "ENCONTRO DE IRMÃOS",
                description: "Dois homens em momento descontraído. Ambiente doméstico sugerem um momento familiar informal.",
                quiz: {
                    question: "Qual deles é o mais novo?",
                    options: ["Telmo", "Paulo", "São gémeos!"],
                    correct: 0
                }
            },
            3: {
                title: "GERAÇÕES FEMININAS",
                description: "Retrato de duas mulheres em ambiente doméstico.",
                quiz: {
                    question: "Qual é a relação entre elas?",
                    options: ["Mãe e filha", "Sogra e nora", "Irmãs"],
                    correct: 1
                }
            },
            4: {
                title: "RETRATO DE MATURIDADE",
                description: "Retrato masculino em ambiente doméstico.",
                quiz: {
                    question: "De que família sou eu?",
                    options: ["Carreira", "Ferreira", "Amado"],
                    correct: 1
                }
            },
            5: {
                title: "INFÂNCIA DOS ANOS 80",
                description: "Retrato infantil ao ar livre com uma boneca típica da época, com vestido estampado com motivos florais.",
                quiz: {
                    question: "De onde veio esta boneca?",
                    options: ["Japão", "Venezuela", "Brasil"],
                    correct: 0
                }
            },
            6: {
                title: "RECREIO URBANO",
                description: "Cena infantil capturada num terraço ou rooftop urbano.",
                quiz: {
                    question: "Estou a brincar com a minha prima?",
                    options: ["Joana", "Maria", "Catarina"],
                    correct: 2
                }
            },
            7: {
                title: "MOMENTO A DOIS",
                description: "Retrato familiar junto à escada da casa da avó.",
                quiz: {
                    question: "Vivemos juntos em casa da avó, o que somos?",
                    options: ["irmãos", "amigos", "primos"],
                    correct: 2
                }
            },
            8: {
                title: "TERNURA GERACIONAL",
                description: "Momento íntimo entre gerações.",
                quiz: {
                    question: "Quem está agarrado ao bébé Lucas?",
                    options: ["Gail", "Iria", "Muñeca"],
                    correct: 0
                }
            },
            9: {
                title: "RETRATO DOMÉSTICO",
                description: "Junto a uma lareira.",
                quiz: {
                    question: "Como o chamavam em pequenino?",
                    options: ["o mais novo", "o reizinho", "bébé"],
                    correct: 2
                }
            },
            10: {
                title: "SERENIDADE AO SOL",
                description: "Sentada no terraço.",
                quiz: {
                    question: "Em que ano nasceu a avó Manuela?",
                    options: ["1915", "1917", "1919"],
                    correct: 0
                }
            },
            11: {
                title: "ALEGRIA INFANTIL",
                description: "Criança com t-shirt branca colorida e um sorriso lindo.",
                quiz: {
                    question: "Quem faz anos a 10 de janeiro?",
                    options: ["Lucas Carreira", "Miguel Carreira", "Felipe Carreira"],
                    correct: 1
                }
            }
        };

        const state = {
            currentIndex: 0,
            photos: [],
            isUnlocked: false,
            quizSolved: false,
            brushSize: 60,
            score: 0,
            failures: 0,
            attempts: {},
            startTime: null,
            endTime: null
        };

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const scratchWrapper = document.getElementById('scratch-wrapper');
        const customCursor = document.getElementById('custom-cursor');
        
        let isDrawing = false;

        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
            const rect = scratchWrapper.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                customCursor.style.display = 'block';
            } else {
                customCursor.style.display = 'none';
            }
        });

        document.addEventListener('mousedown', () => {
            customCursor.style.width = '40px'; customCursor.style.height = '40px';
            customCursor.style.background = 'rgba(255, 255, 255, 0.4)';
        });

        document.addEventListener('mouseup', () => {
            customCursor.style.width = '50px'; customCursor.style.height = '50px';
            customCursor.style.background = 'rgba(255, 255, 255, 0.15)';
        });

        state.photos = Array.from({ length: 11 }, (_, i) => {
            const index = i + 1;
            const config = GALLERY_CONFIG[index] || { title: `Arquivo #${index}`, description: `Dados insuficientes para a evidência ${index}.` };
            return {
                id: index.toString(),
                imageUrl: `./image${index}.jpg`,
                solved: false,
                unlocked: false,
                ...config,
                hiddenLayers: [
                    { type: 'text', content: `ID: ${index}/ 11`, x: 10, y: 15 },
                    { type: 'stamp', content: 'REVELATIO', x: 70, y: 80 }
                ]
            };
        });

        function initCanvas() {
            const rect = scratchWrapper.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
                setTimeout(initCanvas, 50);
                return;
            }
            canvas.width = rect.width;
            canvas.height = rect.height;
            const currentPhoto = state.photos[state.currentIndex];
            state.isUnlocked = currentPhoto.unlocked;
            state.quizSolved = currentPhoto.solved;
            updateUIState();
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#292524';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 3000; i++) {
                ctx.fillStyle = `rgba(150,150,150, 0.05)`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }
            setTimeout(updateNoise, 100);
        }

        function updateUIState() {
            const currentPhoto = state.photos[state.currentIndex];
            const btnNext = document.getElementById('btn-next');
            const btnNextText = document.getElementById('btn-next-text');
            const btnQuiz = document.getElementById('btn-quiz-panel');
            const hud = document.getElementById('hud-sidebar');
            
            // Check if this is the last photo
            const isLastPhoto = state.currentIndex === state.photos.length - 1;
            
            btnNext.disabled = !currentPhoto.solved;
            if (currentPhoto.solved) {
                btnNext.classList.remove('btn-disabled');
                if (isLastPhoto) {
                    btnNextText.innerText = 'Ver Resultados Finais';
                    btnNext.classList.add('bg-amber-500', 'hover:bg-amber-400');
                    btnNext.classList.remove('bg-stone-900', 'hover:bg-stone-950');
                } else {
                    btnNextText.innerText = 'Próxima Evidência';
                    btnNext.classList.remove('bg-amber-500', 'hover:bg-amber-400');
                    btnNext.classList.add('bg-stone-900', 'hover:bg-stone-950');
                }
            } else {
                btnNext.classList.add('btn-disabled');
                btnNextText.innerText = 'Próxima Evidência';
            }
            
            document.getElementById('nav-hint').innerText = currentPhoto.solved ? "Evidência Arquivada." : "Resolva o questionário para prosseguir";
            if (currentPhoto.unlocked && !currentPhoto.solved) {
                btnQuiz.disabled = false;
                btnQuiz.className = "w-full bg-amber-500 text-stone-900 py-4 font-black uppercase tracking-widest hover:bg-amber-400 transition-all flex items-center justify-center gap-3 cursor-pointer ready-to-quiz";
                document.getElementById('quiz-hint').innerText = "Análise Pronta";
                hud.classList.add('unlocked-status');
                document.getElementById('reveal-status').innerText = "CLAREZA ACEITÁVEL";
            } else if (currentPhoto.solved) {
                btnQuiz.disabled = true;
                btnQuiz.className = "w-full bg-stone-700 text-stone-500 py-4 font-black uppercase tracking-widest transition-all flex items-center justify-center gap-3 opacity-50 cursor-not-allowed";
                document.getElementById('quiz-hint').innerText = "Análise Concluída";
                hud.classList.add('unlocked-status');
                document.getElementById('reveal-status').innerText = "ARQUIVADO";
            } else {
                btnQuiz.disabled = true;
                btnQuiz.className = "w-full bg-stone-700 text-stone-500 py-4 font-black uppercase tracking-widest transition-all flex items-center justify-center gap-3 opacity-50 cursor-not-allowed";
                document.getElementById('quiz-hint').innerText = "Clareza insuficiente";
                hud.classList.remove('unlocked-status');
                document.getElementById('reveal-status').innerHTML = 'Remover Ruído (Faltam <span id="target-left">30</span>%)';
            }
        }

        function updateNoise() {
            if (!ctx || canvas.width === 0 || canvas.height === 0) return;
            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                let opaque = 0;
                const step = 60; 
                for (let i = 0; i < pixels.length; i += step) {
                    if (pixels[i + 3] > 10) opaque++;
                }
                const totalSamples = pixels.length / step;
                let noisePct = Math.round((opaque / totalSamples) * 100);
                document.getElementById('reveal-pct').innerText = `${noisePct}%`;
                document.getElementById('progress-fill').style.width = `${noisePct}%`;
                const left = Math.max(0, noisePct - 70);
                const targetLeftEl = document.getElementById('target-left');
                if (targetLeftEl) targetLeftEl.innerText = left;
                if (noisePct <= 70 && !state.photos[state.currentIndex].unlocked) {
                    unlockQuizAction();
                }
                checkVisibility();
            } catch (e) { console.warn("Canvas error", e); }
        }

        function unlockQuizAction() {
            const current = state.photos[state.currentIndex];
            current.unlocked = true;
            state.isUnlocked = true;
            updateUIState();
            app.renderThumbs();
            startTimer();
        }

        function unlockNavigation() {
            const current = state.photos[state.currentIndex];
            current.solved = true;
            state.quizSolved = true;
            
            // Award points based on attempts
            const photoId = current.id;
            const attempts = state.attempts[photoId] || 0;
            let points = 0;
            if (attempts === 0) points = 100;
            else if (attempts === 1) points = 50;
            else points = 25;
            
            state.score += points;
            updateScoreDisplay();
            
            updateUIState();
            document.getElementById('nav-hint').classList.add('text-green-600');
            app.renderThumbs();
        }

        function checkVisibility() {
            if (!ctx || canvas.width === 0 || canvas.height === 0) return;
            document.querySelectorAll('.reveal-layer').forEach(l => {
                const lx = (parseFloat(l.style.left) / 100) * canvas.width;
                const ly = (parseFloat(l.style.top) / 100) * canvas.height;
                if (lx < canvas.width && ly < canvas.height) {
                    const p = ctx.getImageData(lx, ly, 1, 1).data;
                    if (p[3] < 150) l.classList.add('visible');
                }
            });
        }

        function getMousePos(e) {
            const rect = scratchWrapper.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: (clientX - rect.left), y: (clientY - rect.top) };
        }

        function scratch(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, state.brushSize, 0, Math.PI * 2);
            ctx.fill();
            if (Date.now() % 5 === 0) updateNoise();
        }

        scratchWrapper.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        window.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => { isDrawing = false; updateNoise(); });
        scratchWrapper.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive:true});
        window.addEventListener('touchmove', (e) => { scratch(e); }, {passive:true});
        window.addEventListener('touchend', () => { isDrawing = false; updateNoise(); });

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = state.score;
            document.getElementById('failures-display').innerText = state.failures;
        }

        function updateTimer() {
            if (!state.startTime || state.endTime) return;
            
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer-display').innerText = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            if (!state.startTime) {
                state.startTime = Date.now();
                setInterval(updateTimer, 1000);
            }
        }

        const app = {
            render() {
                const current = state.photos[state.currentIndex];
                document.getElementById('case-title').innerText = current.title;
                document.getElementById('case-desc').innerText = `"${current.description}"`;
                document.getElementById('case-number').innerText = state.currentIndex + 1;
                document.getElementById('reveal-img').src = current.imageUrl;
                document.getElementById('overlay-img').src = current.imageUrl;
                const layersDiv = document.getElementById('dynamic-layers');
                layersDiv.innerHTML = '';
                current.hiddenLayers.forEach(l => {
                    const el = document.createElement('div');
                    el.className = 'absolute p-2 reveal-layer';
                    el.style.left = `${l.x}%`; el.style.top = `${l.y}%`;
                    if (l.type === 'text') el.innerHTML = `<div class="bg-white/90 p-2 text-[10px] font-mono shadow-md border-l-2 border-stone-800">${l.content}</div>`;
                    else if (l.type === 'stamp') el.innerHTML = `<div class="archive-stamp text-[12px]">${l.content}</div>`;
                    layersDiv.appendChild(el);
                });
                this.renderThumbs();
                initCanvas();
            },
            renderThumbs() {
                const thumbs = document.getElementById('gallery-thumbs');
                thumbs.innerHTML = '';
                state.photos.forEach((p, i) => {
                    if (p.unlocked) {
                        const b = document.createElement('button');
                        b.className = `w-14 h-14 flex-shrink-0 border-2 transition-all overflow-hidden ${state.currentIndex === i ? 'border-stone-900 scale-110 opacity-100' : 'border-transparent opacity-50 hover:opacity-100'}`;
                        b.innerHTML = `<img src="${p.imageUrl}" class="w-full h-full object-cover">`;
                        b.onclick = () => { state.currentIndex = i; app.render(); };
                        thumbs.appendChild(b);
                    }
                });
            },
            openQuiz() {
                const current = state.photos[state.currentIndex];
                if(!current.unlocked) return;
                const quiz = current.quiz;
                if(!quiz) return;
                const wrapper = document.getElementById('modal-content-wrapper');
                wrapper.innerHTML = `
                    <p class="mb-6 font-bold text-lg text-stone-900">${quiz.question}</p>
                    <div class="space-y-3">${quiz.options.map((o, i) => `
                        <button onclick="app.check(this, ${i}, ${quiz.correct})" class="quiz-option w-full text-left p-4 text-sm font-black uppercase tracking-wider bg-white shadow-sm border-2 border-stone-200 hover:border-stone-400 transition-all">${o}</button>
                    `).join('')}</div>`;
                const modal = document.getElementById('modal-overlay');
                modal.classList.remove('hidden');
                setTimeout(() => { modal.style.opacity = '1'; modal.style.pointerEvents = 'auto'; }, 10);
            },
            check(btn, sel, cor) {
                const current = state.photos[state.currentIndex];
                const photoId = current.id;
                
                // Disable all buttons after selection
                document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
                
                if (sel === cor) {
                    btn.classList.add('quiz-correct');
                    unlockNavigation();
                    setTimeout(() => app.closeModal(), 1200);
                } else {
                    btn.classList.add('quiz-incorrect');
                    state.failures++;
                    state.attempts[photoId] = (state.attempts[photoId] || 0) + 1;
                    updateScoreDisplay();
                    
                    // Re-enable buttons after animation
                    setTimeout(() => {
                        document.querySelectorAll('.quiz-option').forEach(b => {
                            b.disabled = false;
                            b.classList.remove('quiz-incorrect');
                        });
                    }, 600);
                }
            },
            closeModal() {
                const m = document.getElementById('modal-overlay');
                m.style.opacity = '0'; m.style.pointerEvents = 'none';
                setTimeout(() => m.classList.add('hidden'), 300);
            },
            next() { 
                const current = state.photos[state.currentIndex];
                if (!current.solved) return;
                
                // Check if this is the last photo
                if (state.currentIndex === state.photos.length - 1) {
                    // Show final score instead of moving to next
                    app.showFinalScore();
                    return;
                }
                
                state.currentIndex = (state.currentIndex + 1) % state.photos.length; 
                app.render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            showFinalScore() {
                // Stop timer
                if (!state.endTime) {
                    state.endTime = Date.now();
                }
                
                const totalPossible = state.photos.length * 100;
                const percentage = Math.round((state.score / totalPossible) * 100);
                const totalSeconds = Math.floor((state.endTime - state.startTime) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const timeStr = `${minutes}:${String(seconds).padStart(2, '0')}`;
                
                let grade = '';
                let message = '';
                
                if (percentage >= 90) {
                    grade = 'EXCELENTE';
                    message = 'Memória familiar impecável! Você conhece muito bem a história da família.';
                } else if (percentage >= 75) {
                    grade = 'MUITO BOM';
                    message = 'Ótimo conhecimento familiar! Algumas evidências exigiram mais atenção.';
                } else if (percentage >= 60) {
                    grade = 'BOM';
                    message = 'Bom trabalho! Ainda há detalhes da história familiar para explorar.';
                } else {
                    grade = 'COMPLETO';
                    message = 'Missão cumprida! Cada erro é uma oportunidade de aprender mais sobre a família.';
                }
                
                const modal = document.getElementById('modal-container');
                modal.className = 'bg-[#f2efe9] max-w-2xl w-full p-8 md:p-12 shadow-2xl border-t-8 border-amber-500 relative';
                
                document.getElementById('modal-title').innerText = 'MISSÃO CONCLUÍDA';
                const wrapper = document.getElementById('modal-content-wrapper');
                wrapper.innerHTML = `
                    <div class="text-center space-y-6">
                        <div class="inline-block bg-stone-900 text-amber-400 px-6 py-3 text-3xl md:text-4xl font-black tracking-widest">
                            ${grade}
                        </div>
                        
                        <div class="bg-white/50 p-6 rounded-lg space-y-4">
                            <div class="grid grid-cols-3 gap-3">
                                <div class="bg-amber-500/20 border-2 border-amber-500 p-3 rounded">
                                    <div class="text-[10px] uppercase tracking-widest text-stone-600 mb-1">Pontuação</div>
                                    <div class="text-2xl font-black text-amber-600">${state.score}</div>
                                    <div class="text-[10px] text-stone-500">de ${totalPossible}</div>
                                </div>
                                
                                <div class="bg-stone-200 border-2 border-stone-400 p-3 rounded">
                                    <div class="text-[10px] uppercase tracking-widest text-stone-600 mb-1">Erros</div>
                                    <div class="text-2xl font-black text-red-600">${state.failures}</div>
                                    <div class="text-[10px] text-stone-500">tentativas</div>
                                </div>

                                <div class="bg-blue-500/20 border-2 border-blue-500 p-3 rounded">
                                    <div class="text-[10px] uppercase tracking-widest text-stone-600 mb-1">Tempo</div>
                                    <div class="text-2xl font-black text-blue-600">${timeStr}</div>
                                    <div class="text-[10px] text-stone-500">minutos</div>
                                </div>
                            </div>
                            
                            <div class="bg-stone-100 p-4 rounded">
                                <div class="text-xs uppercase tracking-widest text-stone-600 mb-2">Aproveitamento</div>
                                <div class="w-full bg-stone-300 rounded-full h-8 overflow-hidden">
                                    <div class="bg-gradient-to-r from-amber-500 to-amber-400 h-full flex items-center justify-center text-white font-black text-sm transition-all duration-1000" style="width: ${percentage}%">
                                        ${percentage}%
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <p class="text-stone-700 text-lg italic leading-relaxed">${message}</p>
                        
                        <div class="pt-4 space-y-3">
                            <button onclick="location.reload()" class="w-full bg-stone-900 text-white py-4 px-6 font-bold uppercase tracking-widest hover:bg-stone-800 transition-all">
                                Reiniciar Missão
                            </button>
                            <button onclick="app.closeModal()" class="w-full bg-stone-300 text-stone-700 py-3 px-6 font-bold uppercase tracking-widest hover:bg-stone-400 transition-all">
                                Revisar Evidências
                            </button>
                        </div>
                    </div>
                `;
                
                const modalOverlay = document.getElementById('modal-overlay');
                modalOverlay.classList.remove('hidden');
                setTimeout(() => { 
                    modalOverlay.style.opacity = '1'; 
                    modalOverlay.style.pointerEvents = 'auto'; 
                }, 10);
            }
        };
        window.app = app;
        window.addEventListener('load', () => app.render());
    </script>
</body>
</html>
