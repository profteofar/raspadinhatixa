
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVELATIO - Arquivo Familiar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #e2dcd0;
            color: #1c1917;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        canvas { touch-action: none; cursor: none; display: block; }
        
        /* Cursor Customizado */
        .custom-cursor {
            width: 60px;
            height: 60px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
            display: none;
        }
        @media (hover: hover) {
            .custom-cursor { display: block; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        const GALLERY_CONFIG = {
          1: { title: "SORRISO LUMINOSO", description: "Um sorriso genuíno e radiante.", quiz: { question: "Em que ano nasci?", options: ["1971", "1975", "1976"], correct: 1 } },
          2: { title: "ENCONTRO DE IRMÃOS", description: "Dois homens em momento descontraído. Ambiente doméstico sugerem um momento familiar informal.", quiz: { question: "Qual deles é o mais novo?", options: ["Telmo", "Paulo", "São gémeos!"], correct: 0 } },
          3: { title: "GERAÇÕES FEMININAS", description: "Retrato de duas mulheres em ambiente doméstico.", quiz: { question: "Qual é a relação entre elas?", options: ["Mãe e filha", "Sogra e nora", "Irmãs"], correct: 1 } },
          4: { title: "RETRATO DE MATURIDADE", description: "Retrato masculino em ambiente doméstico.", quiz: { question: "De que família sou eu?", options: ["Carreira", "Ferreira", "Amado"], correct: 1 } },
          5: { title: "INFÂNCIA DOS ANOS 80", description: "Retrato infantil ao ar livre com uma boneca típica da época, com vestido estampado com motivos florais.", quiz: { question: "De onde veio esta boneca?", options: ["Japão", "Venezuela", "Brasil"], correct: 0 } },
          6: { title: "RECREIO URBANO", description: "Cena infantil capturada num terraço ou rooftop urbano.", quiz: { question: "Estou a brincar com a minha prima?", options: ["Joana", "Maria", "Catarina"], correct: 2 } },
          7: { title: "MOMENTO A DOIS", description: "Retrato familiar junto à escada da casa da avó.", quiz: { question: "Vivemos juntos em casa da avó, o que somos?", options: ["irmãos", "amigos", "primos"], correct: 2 } },
          8: { title: "TERNURA GERACIONAL", description: "Momento íntimo entre gerações.", quiz: { question: "Quem está agarrado ao bébé Lucas?", options: ["Gail", "Iria", "Muñeca"], correct: 0 } },
          9: { title: "RETRATO DOMÉSTICO", description: "Junto a uma lareira.", quiz: { question: "Como o chamavam em pequenino?", options: ["o mais novo", "o reizinho", "bébé"], correct: 2 } },
          10: { title: "SERENIDADE AO SOL", description: "Sentada no terraço.", quiz: { question: "Em que ano nasceu a avó Manuela?", options: ["1915", "1917", "1919"], correct: 0 } },
          11: { title: "ALEGRIA INFANTIL", description: "Criança com t-shirt branca colorida e um sorriso lindo.", quiz: { question: "Quem faz anos a 10 de janeiro?", options: ["Lucas Carreira", "Miguel Carreira", "Felipe Carreira"], correct: 1 } }
        };

        const REVEAL_THRESHOLD = 65; 

        const App = () => {
          const [photos, setPhotos] = useState(() => 
            Array.from({ length: 11 }, (_, i) => {
              const index = i + 1;
              return {
                id: index.toString(),
                imageUrl: `./image${index}.jpg`,
                unlocked: false,
                solved: false,
                ...GALLERY_CONFIG[index],
                hiddenLayers: [
                  { type: 'text', content: `DOC_ID: ${index}/11`, x: 10, y: 15 },
                  { type: 'stamp', content: 'REVELATIO', x: 70, y: 80 }
                ]
              };
            })
          );

          const [currentIndex, setCurrentIndex] = useState(0);
          const [revealPct, setRevealPct] = useState(0);
          const [isQuizOpen, setIsQuizOpen] = useState(false);
          const [showAlbum, setShowAlbum] = useState(false);
          const [showFinalScore, setShowFinalScore] = useState(false);
          const [score, setScore] = useState(0);
          const [failures, setFailures] = useState(0);
          const [timer, setTimer] = useState(0);
          const [isGameStarted, setIsGameStarted] = useState(false);
          const [isDrawing, setIsDrawing] = useState(false);

          const canvasRef = useRef(null);
          const containerRef = useRef(null);
          const cursorRef = useRef(null);
          const timerRef = useRef(null);

          const currentPhoto = photos[currentIndex];

          const stats = useMemo(() => {
            const solvedCount = photos.filter(p => p.solved).length;
            const attempts = solvedCount + failures;
            const accuracy = attempts > 0 
                ? Math.round((solvedCount / attempts) * 100) 
                : 0;
            const avgTime = solvedCount > 0 
                ? Math.round(timer / solvedCount) 
                : 0;
            return { accuracy, avgTime, solvedCount };
          }, [photos, failures, timer]);

          const initCanvas = useCallback(() => {
            const canvas = canvasRef.current;
            const container = containerRef.current;
            if (!canvas || !container) return;
            
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#292524'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 3000; i++) {
              ctx.fillStyle = `rgba(160, 160, 160, 0.04)`;
              ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }
            setRevealPct(0);
          }, [currentIndex]);

          useEffect(() => {
            const timerId = setTimeout(initCanvas, 100);
            window.addEventListener('resize', initCanvas);
            return () => {
              window.removeEventListener('resize', initCanvas);
              clearTimeout(timerId);
            };
          }, [currentIndex, initCanvas]);

          useEffect(() => {
            if (isGameStarted && !showFinalScore && !showAlbum) {
              timerRef.current = setInterval(() => setTimer(prev => prev + 1), 1000);
            } else {
              clearInterval(timerRef.current);
            }
            return () => clearInterval(timerRef.current);
          }, [isGameStarted, showFinalScore, showAlbum]);

          const calculateReveal = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparent = 0;
            
            for (let i = 0; i < pixels.length; i += 40) {
              if (pixels[i + 3] < 128) transparent++;
            }
            
            const totalSamples = pixels.length / 40;
            const pct = Math.round((transparent / totalSamples) * 100);
            setRevealPct(pct);

            if (pct >= REVEAL_THRESHOLD && !currentPhoto.unlocked) {
              const updated = [...photos];
              updated[currentIndex].unlocked = true;
              setPhotos(updated);
              setIsGameStarted(true);
            }
          };

          const handlePointerDown = (e) => {
            setIsDrawing(true);
            if (cursorRef.current) {
                cursorRef.current.style.width = '45px';
                cursorRef.current.style.height = '45px';
                cursorRef.current.style.background = 'rgba(255,255,255,0.3)';
            }
            handlePointerMove(e);
          };

          const handlePointerUp = () => {
            setIsDrawing(false);
            if (cursorRef.current) {
                cursorRef.current.style.width = '60px';
                cursorRef.current.style.height = '60px';
                cursorRef.current.style.background = 'rgba(255,255,255,0.1)';
            }
            calculateReveal();
          };

          const handlePointerMove = (e) => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            if (cursorRef.current) {
                cursorRef.current.style.left = `${clientX}px`;
                cursorRef.current.style.top = `${clientY}px`;
            }

            if (!isDrawing || showAlbum || showFinalScore || currentPhoto.solved) return;
            
            const ctx = canvas.getContext('2d');
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const brushSize = e.touches ? 65 : 50;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, brushSize, 0, Math.PI * 2);
            ctx.fill();

            if (Math.random() > 0.85) calculateReveal();
          };

          const handleQuizAnswer = (idx) => {
            if (idx === currentPhoto.quiz.correct) {
              const updated = [...photos];
              updated[currentIndex].solved = true;
              setPhotos(updated);
              setScore(s => s + 100);
              setIsQuizOpen(false);
            } else {
              setFailures(f => f + 1);
            }
          };

          const handleNext = () => {
            if (currentIndex < photos.length - 1) {
              setCurrentIndex(currentIndex + 1);
            } else {
              setShowFinalScore(true);
            }
          };

          const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

          return (
            <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto font-['Crimson_Pro'] select-none overflow-x-hidden">
              <div ref={cursorRef} className="custom-cursor" />
              
              <header className="text-center mb-8">
                <h1 className="font-['Playfair_Display'] text-5xl md:text-8xl font-black text-stone-900 mb-2 tracking-tight">REVELATIO</h1>
                <p className="text-stone-500 tracking-[0.3em] uppercase text-[10px] md:text-xs font-bold">Arquivo de Memórias de Família</p>
              </header>

              <main className="grid lg:grid-cols-12 gap-8 items-start">
                <div className="lg:col-span-7 relative">
                  <div 
                    ref={containerRef}
                    className="aspect-[4/3] bg-stone-900 border-4 md:border-8 border-stone-900 shadow-2xl overflow-hidden relative"
                    onPointerMove={handlePointerMove}
                  >
                    <div className="absolute inset-0 bg-stone-200">
                      <img 
                        src={currentPhoto.imageUrl} 
                        className={`w-full h-full object-cover transition-all duration-1000 ${currentPhoto.solved ? 'grayscale-0' : 'grayscale opacity-50'}`} 
                        alt="Evidência" 
                      />
                      {currentPhoto.hiddenLayers.map((layer, i) => (
                        <div key={i} className={`absolute transition-opacity duration-1000 pointer-events-none ${revealPct > 40 ? 'opacity-100' : 'opacity-0'}`} style={{ left: `${layer.x}%`, top: `${layer.y}%` }}>
                          <div className="bg-white/80 px-2 py-1 text-[10px] font-mono border-l-2 border-stone-800 shadow-sm uppercase">{layer.content}</div>
                        </div>
                      ))}
                    </div>

                    <canvas 
                      ref={canvasRef} 
                      className={`absolute inset-0 z-10 transition-opacity duration-700 ${currentPhoto.solved ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                      onPointerDown={handlePointerDown}
                      onPointerUp={handlePointerUp}
                      onPointerLeave={handlePointerUp}
                    />
                    
                    {currentPhoto.solved && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                        <div className="bg-stone-900/90 text-white px-8 py-4 font-['Playfair_Display'] text-2xl italic border border-white/20 animate-fade-in shadow-2xl">
                          Evidência Documentada
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-6">
                  <div className="bg-stone-800 text-stone-100 p-8 shadow-2xl relative min-h-[400px] flex flex-col border-b-8 border-amber-600">
                    <div className="flex gap-4 mb-8 text-[10px] font-black uppercase bg-stone-900 p-3 self-start border border-stone-700 font-mono">
                      <span className="text-amber-400">★ {score}</span>
                      <span className="text-red-400">✗ {failures}</span>
                      <span className="text-blue-400">⏱ {formatTime(timer)}</span>
                    </div>

                    <div className="mb-8">
                      <div className="flex justify-between items-end mb-2">
                        <span className="text-[10px] tracking-widest text-stone-400 uppercase">Estado da Revelação</span>
                        <span className="text-xl font-black text-amber-500">{revealPct}%</span>
                      </div>
                      <div className="h-2 bg-stone-900 rounded-full overflow-hidden border border-stone-700">
                        <div className={`h-full transition-all duration-300 ${currentPhoto.unlocked ? 'bg-green-500' : 'bg-amber-500'}`} style={{ width: `${revealPct}%` }} />
                      </div>
                    </div>

                    <div className="border-b border-stone-600 pb-4 mb-4">
                      <span className="text-[10px] text-stone-400 uppercase tracking-widest font-bold">Documento #{currentPhoto.id.padStart(3,'0')}</span>
                      <h2 className="font-['Playfair_Display'] text-3xl font-bold mt-1 uppercase text-amber-500 tracking-tight">{currentPhoto.title}</h2>
                    </div>
                    
                    <p className="text-stone-300 text-lg italic leading-relaxed flex-grow">"{currentPhoto.description}"</p>

                    <button 
                      onClick={() => setIsQuizOpen(true)}
                      disabled={!currentPhoto.unlocked || currentPhoto.solved}
                      className={`mt-6 w-full py-4 font-black uppercase tracking-widest transition-all border-2 text-xs ${
                        currentPhoto.solved ? 'border-stone-700 text-stone-600 cursor-not-allowed' : 
                        currentPhoto.unlocked ? 'bg-amber-500 text-stone-900 border-amber-500 hover:bg-amber-400 active:scale-[0.98]' : 
                        'border-stone-700 text-stone-600 cursor-not-allowed opacity-50'
                      }`}
                    >
                      {currentPhoto.solved ? 'Análise Concluída' : 'Questionar Autenticidade'}
                    </button>
                  </div>

                  <button 
                    onClick={handleNext}
                    disabled={!currentPhoto.solved}
                    className={`w-full py-5 font-bold uppercase tracking-widest shadow-xl border-b-4 transition-all active:translate-y-1 ${
                      currentPhoto.solved ? 'bg-stone-900 text-white border-stone-700 hover:bg-black' : 'bg-stone-200 text-stone-400 border-stone-300 cursor-not-allowed'
                    }`}
                  >
                    {currentIndex === photos.length - 1 ? 'Finalizar Pesquisa' : 'Próxima Evidência →'}
                  </button>
                </div>
              </main>

              <footer className="mt-12 pt-8 border-t border-stone-300">
                <div className="flex gap-4 overflow-x-auto pb-6 scrollbar-hide">
                  {photos.map((p, i) => (
                    <button
                      key={p.id}
                      onClick={() => setCurrentIndex(i)}
                      className={`w-16 h-16 md:w-20 md:h-20 flex-shrink-0 border-2 transition-all relative ${currentIndex === i ? 'border-stone-900 scale-110 shadow-lg z-10' : 'border-transparent opacity-40 hover:opacity-70'}`}
                    >
                      {p.unlocked ? <img src={p.imageUrl} className="w-full h-full object-cover grayscale" /> : <div className="w-full h-full bg-stone-300 flex items-center justify-center text-xs font-bold">?</div>}
                      {p.solved && <div className="absolute -top-1 -right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-[#e2dcd0]" />}
                    </button>
                  ))}
                </div>
              </footer>

              {isQuizOpen && (
                <div className="fixed inset-0 z-[200] bg-stone-900/95 backdrop-blur-md flex items-center justify-center p-6 animate-fade-in">
                  <div className="bg-[#f2efe9] max-w-lg w-full p-8 shadow-2xl border-t-8 border-stone-900">
                    <h3 className="font-['Playfair_Display'] text-2xl font-bold mb-6 border-b border-stone-300 pb-2 italic">Validação Crítica</h3>
                    <p className="mb-8 font-bold text-xl text-stone-900 leading-snug">{currentPhoto.quiz.question}</p>
                    <div className="space-y-3">
                      {currentPhoto.quiz.options.map((opt, i) => (
                        <button key={i} onClick={() => handleQuizAnswer(i)} className="w-full text-left p-5 text-sm font-black uppercase tracking-wider bg-white border-2 border-stone-200 hover:border-amber-500 hover:bg-amber-50 transition-all flex justify-between group">
                          {opt} <span className="opacity-0 group-hover:opacity-100">→</span>
                        </button>
                      ))}
                    </div>
                    <button onClick={() => setIsQuizOpen(false)} className="mt-8 text-stone-400 text-xs uppercase tracking-widest font-bold hover:text-stone-900">Cancelar</button>
                  </div>
                </div>
              )}

              {showFinalScore && (
                <div className="fixed inset-0 z-[300] bg-stone-950 flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-[#f2efe9] max-w-2xl w-full p-8 md:p-12 shadow-2xl border-t-8 border-amber-600 text-center space-y-8 overflow-y-auto max-h-[90vh] scrollbar-hide">
                    <div className="space-y-2">
                        <h2 className="font-['Playfair_Display'] text-4xl md:text-5xl font-black text-stone-900 uppercase tracking-tighter italic">Arquivo Consolidado</h2>
                        <p className="text-stone-400 text-[10px] uppercase tracking-[0.3em] font-bold">Relatório de Desempenho Investigativo</p>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
                      <div className="bg-white p-4 border border-stone-200 shadow-sm"><span className="text-[9px] uppercase text-stone-500 font-bold block mb-1">Pontos</span><p className="text-3xl font-black text-amber-600">{score}</p></div>
                      <div className="bg-white p-4 border border-stone-200 shadow-sm"><span className="text-[9px] uppercase text-stone-500 font-bold block mb-1">Erros</span><p className="text-3xl font-black text-red-600">{failures}</p></div>
                      <div className="bg-white p-4 border border-stone-200 shadow-sm col-span-2 md:col-span-1"><span className="text-[9px] uppercase text-stone-500 font-bold block mb-1">Tempo Total</span><p className="text-3xl font-black text-blue-600">{formatTime(timer)}</p></div>
                    </div>

                    <div className="border-t border-stone-200 pt-8">
                        <h4 className="text-[10px] uppercase font-bold tracking-[0.2em] text-stone-400 mb-6">Métricas Analíticas</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {/* Card Média de Tempo */}
                            <div className="flex flex-col bg-stone-800 p-6 border-b-4 border-amber-500 shadow-lg text-left relative overflow-hidden group">
                                <span className="text-[10px] uppercase font-bold text-stone-400 tracking-widest mb-2 relative z-10">Média por Documento</span>
                                <div className="flex items-baseline gap-2 relative z-10">
                                    <span className="text-4xl font-black text-white font-mono">{stats.avgTime}</span>
                                    <span className="text-amber-500 font-bold text-sm uppercase">segundos</span>
                                </div>
                                <div className="absolute right-[-10px] bottom-[-10px] text-6xl text-white/5 font-black italic select-none">AVG</div>
                            </div>
                            
                            {/* Card Precisão - FOCO NA LEITURA CLARA */}
                            <div className="flex flex-col bg-stone-900 p-6 border-b-4 border-emerald-500 shadow-lg text-left relative overflow-hidden group">
                                <span className="text-[10px] uppercase font-bold text-emerald-400/80 tracking-widest mb-2 relative z-10">Taxa de Precisão</span>
                                <div className="flex items-baseline gap-1 relative z-10">
                                    <span className="text-5xl font-black text-emerald-400 font-mono tracking-tighter">{stats.accuracy}</span>
                                    <span className="text-emerald-400 font-black text-2xl">%</span>
                                </div>
                                <div className="mt-2 h-1 w-full bg-stone-700 rounded-full overflow-hidden">
                                    <div className="h-full bg-emerald-500 transition-all duration-1000" style={{ width: `${stats.accuracy}%` }} />
                                </div>
                                <div className="absolute right-[-10px] bottom-[-10px] text-6xl text-white/5 font-black italic select-none">ACC</div>
                            </div>
                        </div>
                    </div>

                    <div className="pt-6 space-y-4">
                      <button 
                        onClick={() => { setShowAlbum(true); setShowFinalScore(false); }}
                        className="w-full bg-amber-500 text-stone-900 py-6 font-black uppercase tracking-widest text-xs hover:bg-amber-400 shadow-xl transition-all active:scale-95 border-b-4 border-amber-700"
                      >
                        Aceder ao Álbum de Fotos Completo
                      </button>
                      <button onClick={() => window.location.reload()} className="w-full bg-stone-900 text-white py-4 font-black uppercase tracking-widest text-[10px] opacity-60 hover:opacity-100 transition-opacity">Reiniciar Investigação</button>
                    </div>
                  </div>
                </div>
              )}

              {showAlbum && (
                <div className="fixed inset-0 z-[400] bg-stone-950 flex flex-col p-6 md:p-12 overflow-hidden animate-fade-in">
                  <div className="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
                    <h2 className="font-['Playfair_Display'] text-4xl md:text-6xl font-black text-white italic">Álbum REVELATIO</h2>
                    <button onClick={() => setShowAlbum(false)} className="bg-white/10 text-white px-8 py-3 uppercase text-[10px] font-black border border-white/20 tracking-widest">Fechar</button>
                  </div>
                  <div className="flex-grow overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10 pb-32 scrollbar-hide">
                    {photos.map(p => (
                      <div key={p.id} className="bg-stone-900/50 p-5 border border-white/5 flex flex-col group">
                        <div className="aspect-square bg-black overflow-hidden mb-6">
                          <img src={p.imageUrl} className="w-full h-full object-cover transition-all duration-1000 group-hover:scale-105 opacity-90 group-hover:opacity-100" />
                        </div>
                        <h3 className="text-amber-500 font-bold uppercase tracking-widest text-sm mb-3 text-center">{p.title}</h3>
                        <p className="text-stone-400 text-[11px] italic text-center px-4 leading-relaxed">"{p.description}"</p>
                      </div>
                    ))}
                  </div>
                  <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-stone-950 via-stone-950 to-transparent">
                    <p className="text-stone-600 text-[9px] text-center uppercase tracking-[0.5em] font-mono font-bold">Arquivo Histórico Imutável — Direitos de Memória Reservados</p>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
